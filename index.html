<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adventskalender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6efe3;
    --card: #fffaf2;
    --ink: #2b2420;
    --muted: #7a6b5f;
    --accent: #a8322d;
    --green: #2f4a3a;
    --line: #e6dccb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.6 "Inter", system-ui, sans-serif;
    min-height: 100vh;
  }
  main { max-width: 560px; margin: 0 auto; padding: 32px 20px 64px; }
  .kicker {
    text-transform: uppercase; letter-spacing: .14em;
    font-size: 12px; font-weight: 600; color: var(--accent);
    margin: 0 0 8px;
  }
  h1 {
    font-family: "Fraunces", Georgia, serif; font-weight: 700;
    font-size: 40px; line-height: 1.1; margin: 0 0 24px;
  }
  .zahl {
    font-family: "Fraunces", Georgia, serif; font-weight: 700;
    font-size: 96px; line-height: 1; color: var(--green); margin: 0 0 4px;
  }
  .karte {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 24px; margin: 0 0 20px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(60,40,20,.06);
  }
  .karte p { margin: 0 0 1em; }
  .karte p:last-child { margin-bottom: 0; }
  img.bild { width: 100%; border-radius: 12px; display: block; margin: 0 0 20px; }
  audio { width: 100%; margin: 0 0 20px; }
  a.knopf, button {
    display: inline-block; background: var(--green); color: #fff;
    border: 0; border-radius: 999px; padding: 12px 22px;
    font: 600 16px "Inter", system-ui, sans-serif;
    text-decoration: none; cursor: pointer;
  }
  input {
    width: 100%; padding: 12px 14px; font: inherit;
    border: 1px solid var(--line); border-radius: 10px;
    background: #fff; margin: 12px 0;
  }
  .hinweis { color: var(--muted); font-size: 15px; }
  .falsch { color: var(--accent); font-size: 15px; margin-top: 8px; }
  .belohnung { margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--line); }
  .gitter {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  .tuer {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border-radius: 12px; font-family: "Fraunces", Georgia, serif;
    font-size: 24px; font-weight: 700; text-decoration: none;
    background: var(--card); border: 1px solid var(--line); color: var(--muted);
  }
  .tuer.offen { background: var(--green); color: #fff; border-color: var(--green); }
  .zurueck { display: inline-block; margin-top: 12px; color: var(--muted); font-size: 15px; }
  .gruss { font-family: "Fraunces", Georgia, serif; font-style: italic; margin-top: 24px; color: var(--muted); }
</style>
</head>
<body>
<main id="app"></main>

<script src="tage.js"></script>
<script>
  const app = document.getElementById("app");
  const E = typeof EINSTELLUNGEN !== "undefined" ? EINSTELLUNGEN : { jahr: new Date().getFullYear() };
  const vorschau = new URLSearchParams(location.search).has("vorschau");

  function el(tag, attrs = {}, kinder = []) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "text") n.textContent = v;
      else n.setAttribute(k, v);
    }
    for (const k of [].concat(kinder)) if (k) n.append(k);
    return n;
  }

  function absaetze(text) {
    return String(text || "").trim().split(/\n\s*\n/).map(t => el("p", { text: t.trim() }));
  }

  function istOffen(tag) {
    if (vorschau) return true;
    const heute = new Date();
    return heute >= new Date(E.jahr, 11, tag);
  }

  function tageBis(tag) {
    const heute = new Date(); heute.setHours(0, 0, 0, 0);
    return Math.round((new Date(E.jahr, 11, tag) - heute) / 86400000);
  }

  function normal(s) {
    return String(s).toLowerCase().trim().replace(/\s+/g, " ");
  }

  function linkMitVorschau(hash) {
    return (vorschau ? "?vorschau" : "") + hash;
  }

  function zeigeUebersicht() {
    app.replaceChildren(
      el("p", { class: "kicker", text: "Adventskalender " + E.jahr }),
      el("h1", { text: E.titel || "Für dich" }),
      el("div", { class: "gitter" },
        Array.from({ length: 24 }, (_, i) => {
          const t = i + 1, offen = istOffen(t);
          return el(offen ? "a" : "span", {
            class: "tuer" + (offen ? " offen" : ""),
            ...(offen ? { href: linkMitVorschau("#" + t) } : {}),
            text: String(t)
          });
        })
      ),
      E.gruss ? el("p", { class: "gruss", text: E.gruss }) : null
    );
  }

  function zeigeTag(tag) {
    const d = (typeof TAGE !== "undefined" && TAGE[tag]) || {};
    const kopf = [
      el("p", { class: "kicker", text: tag + ". Dezember" }),
      el("div", { class: "zahl", text: String(tag) })
    ];

    if (!istOffen(tag)) {
      const n = tageBis(tag);
      app.replaceChildren(...kopf,
        el("div", { class: "karte" }, [
          el("p", { text: "Noch nicht schummeln! 🎄" }),
          el("p", { class: "hinweis", text: n === 1 ? "Morgen ist es so weit." : "Noch " + n + " Tage Geduld." })
        ]),
        el("a", { class: "zurueck", href: linkMitVorschau("#"), text: "← Alle Türchen" })
      );
      return;
    }

    const inhalt = [];
    if (d.titel) inhalt.push(el("h1", { text: d.titel }));
    if (d.bild) inhalt.push(el("img", { class: "bild", src: d.bild, alt: d.titel || "" }));

    const karte = el("div", { class: "karte" }, absaetze(d.text || "Hier kommt bald etwas Schönes hin."));
    inhalt.push(karte);

    if (d.audio) inhalt.push(el("audio", { controls: "", src: d.audio }));

    if (d.raetsel) {
      const r = d.raetsel;
      const eingabe = el("input", { placeholder: "Deine Antwort", autocomplete: "off" });
      const meldung = el("div", { class: "falsch" });
      const knopf = el("button", { text: "Prüfen" });
      const box = el("div", { class: "karte" }, [
        el("p", { text: r.frage }), eingabe, knopf, meldung
      ]);
      const antworten = [].concat(r.antwort).map(normal);
      const pruefen = () => {
        if (antworten.includes(normal(eingabe.value))) {
          box.replaceChildren(el("p", { text: r.frage }),
            el("div", { class: "belohnung" }, absaetze(r.belohnung || "Richtig! ❤️")));
        } else {
          meldung.textContent = r.tipp ? "Fast … Tipp: " + r.tipp : "Leider nicht – versuch's nochmal.";
        }
      };
      knopf.addEventListener("click", pruefen);
      eingabe.addEventListener("keydown", e => { if (e.key === "Enter") pruefen(); });
      inhalt.push(box);
    }

    if (d.link) inhalt.push(el("p", {}, el("a", { class: "knopf", href: d.link.url, target: "_blank", rel: "noopener", text: d.link.text || "Öffnen" })));

    app.replaceChildren(...kopf, ...inhalt,
      el("a", { class: "zurueck", href: linkMitVorschau("#"), text: "← Alle Türchen" }));
  }

  function route() {
    const tag = parseInt(location.hash.replace("#", ""), 10);
    if (tag >= 1 && tag <= 24) zeigeTag(tag); else zeigeUebersicht();
    window.scrollTo(0, 0);
  }

  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
